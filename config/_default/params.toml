mainSections   = ["post"]

[colorScheme]
    toggle  = true
    default = "dark"
rssFullContent = true
favicon        = "img/favicon.png"

[footer]
    since = 2024

[sidebar]
    emoji    = "🧠"
    subtitle = "技术探索 · AI实践 · 随想记录"
    avatar   = "img/avatar.png"

[article]
    [article.license]
        enabled = true
        default = "本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

# 邮件订阅入口（仓库 luoli523/guige-subscribe，名单在 Resend）；群发由 deploy.yml 触发
[subscribe]
    endpoint = "https://subscribe.guige.ai/subscribe"

[comments]
    enabled  = true
    provider = "waline"

    [comments.waline]
        serverURL   = "https://waline-server-amber.vercel.app"
        lang        = "zh-CN"
        dark        = "auto"
        reaction    = true
        requiredMeta = ["nick"]

[analytics]
    [analytics.cloudflare]
        token = "6aaf83fc05e244f88ca89346fb1acdcb"

[cookies]
    enabled = false
