<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">鬼哥的本地 AI 口播演播室</title>
  <desc id="diagram-desc">浏览器访问 Mac mini 上的 Open WebUI，后端调用本机 Qwen3-TTS 和字幕进程，并通过两条 SSH 隧道访问 4090 上的 Qwen Image 与 MiniMax H3。生成结果返回 Mac 保存。</desc>

  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'PingFang SC', 'Noto Sans SC', monospace; fill: #f8fafc; }
    .title    { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 12px; font-weight: 400; fill: #94a3b8; }
    .group    { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .label    { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub      { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
    .annot    { font-size: 10px; font-weight: 400; fill: #cbd5e1; }
    .edge     { font-size: 10px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
    .legend   { font-size: 10px; fill: #94a3b8; }
    .caption  { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }

    .mask   { fill: #0f172a; }
    .node   { stroke-width: 1.5; }
    .primary   { fill: rgba(8, 51, 68, 0.4);    stroke: #22d3ee; }
    .secondary { fill: rgba(6, 78, 59, 0.4);    stroke: #34d399; }
    .data      { fill: rgba(76, 29, 149, 0.4);  stroke: #a78bfa; }
    .infra     { fill: rgba(120, 53, 15, 0.3);  stroke: #fbbf24; }
    .alert     { fill: rgba(136, 19, 55, 0.4);  stroke: #fb7185; }
    .bus       { fill: rgba(251, 146, 60, 0.3); stroke: #fb923c; }
    .neutral   { fill: rgba(30, 41, 59, 0.5);   stroke: #94a3b8; }
    .highlight { fill: rgba(59, 130, 246, 0.3); stroke: #60a5fa; }

    .region       { fill: none; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { font-size: 10px; font-weight: 600; }
    .conn      { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .conn-dim  { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-opacity: 0.55; }
    .conn-main { fill: none; stroke: #60a5fa; stroke-width: 2; }
    .conn-err  { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 3; }
    .lifeline  { stroke: #334155; stroke-width: 1; stroke-dasharray: 6 4; }
    .divider   { stroke: #334155; stroke-width: 1; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-err" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto-start-reverse">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <marker id="inherit" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto-start-reverse">
      <polygon points="0 0, 12 5, 0 10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
    <marker id="diamond-filled" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#94a3b8"/>
    </marker>
    <marker id="diamond-open" markerWidth="12" markerHeight="8" refX="0" refY="4" orient="auto-start-reverse">
      <polygon points="0 4, 6 0, 12 4, 6 8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1. background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 2. title block (top-left, x=40 y=44) -->
  <text class="title" x="40" y="44">鬼哥的本地 AI 口播演播室</text>
  <text class="subtitle" x="40" y="64">M6 Mac mini 管工作台、声音与字幕 · 48GB 4090 管图像与视频</text>

  <!-- 3. regions (dashed boundaries) -->
  <g id="regions">
    <rect class="region" x="260" y="110" width="500" height="570" rx="12" stroke="#fbbf24"/>
    <text class="region-label" x="280" y="132">M6 Mac mini · 32GB 统一内存</text>
    <rect class="region" x="860" y="250" width="300" height="330" rx="12" stroke="#fbbf24"/>
    <text class="region-label" x="880" y="272">Ubuntu · RTX 4090 48GB</text>
    <text class="annot" x="890" y="555">图像 / 视频共用 GPU 锁，任务后释放</text>
  </g>

  <!-- 4. connectors (behind nodes) -->
  <g id="connectors">
    <path class="conn-main" d="M 224,370 H 276" marker-end="url(#arrow-main)"/>
    <path class="conn" d="M 484,370 H 500 V 210 H 516" marker-end="url(#arrow)"/>
    <path class="conn" d="M 500,350 H 516" marker-end="url(#arrow)"/>
    <path class="conn" d="M 500,370 V 630 H 516" marker-end="url(#arrow)"/>
    <path class="conn" d="M 500,490 H 516" marker-end="url(#arrow)"/>
    <path class="conn-main" d="M 724,350 H 896" marker-end="url(#arrow-main)"/>
    <path class="conn-main" d="M 724,490 H 896" marker-end="url(#arrow-main)"/>
    <text class="edge" x="810" y="338">SSH · 28093 → 8093</text>
    <text class="edge" x="810" y="478">SSH · 28092 → 8092</text>
  </g>

  <!-- 5. nodes: each node = mask rect + styled rect + labels -->
  <g id="nodes">
    <g transform="translate(60,330)">
      <rect class="mask" width="160" height="80" rx="6"/><rect class="node primary" width="160" height="80" rx="6"/>
      <text class="label" x="80" y="28">浏览器</text><text class="sub" x="80" y="48">/audio-studio</text><text class="sub" x="80" y="64">文案 · 人物 · 音色</text>
    </g>
    <g transform="translate(280,320)">
      <rect class="mask" width="200" height="100" rx="6"/><rect class="node neutral" width="200" height="100" rx="6"/>
      <text class="label" x="100" y="28">Open WebUI · :8080</text><text class="sub" x="100" y="48">定制工作台 / 后端编排</text><text class="sub" x="100" y="66">用户权限 · 素材 · 持久任务</text><text class="sub" x="100" y="84">结果保存与鉴权下载</text>
    </g>
    <g transform="translate(520,170)">
      <rect class="mask" width="200" height="80" rx="6"/><rect class="node secondary" width="200" height="80" rx="6"/>
      <text class="label" x="100" y="24">local-tts · :8091</text><text class="sub" x="100" y="43">Qwen3-TTS / MLX Whisper</text><text class="sub" x="100" y="59">/v1/audio/speech</text><text class="sub" x="100" y="73">预设 · 克隆 · 设计 · 录音转写</text>
    </g>
    <g transform="translate(520,310)">
      <rect class="mask" width="200" height="80" rx="6"/><rect class="node secondary" width="200" height="80" rx="6"/>
      <text class="label" x="100" y="25">图像后端代理</text><text class="sub" x="100" y="46">127.0.0.1:28093</text><text class="sub" x="100" y="65">密钥保存在 WebUI 后端</text>
    </g>
    <g transform="translate(520,450)">
      <rect class="mask" width="200" height="80" rx="6"/><rect class="node secondary" width="200" height="80" rx="6"/>
      <text class="label" x="100" y="25">4090 H3 Provider</text><text class="sub" x="100" y="46">127.0.0.1:28092</text><text class="sub" x="100" y="65">上传素材 · 提交 / 查询 / 下载</text>
    </g>
    <g transform="translate(520,590)">
      <rect class="mask" width="200" height="80" rx="6"/><rect class="node secondary" width="200" height="80" rx="6"/>
      <text class="label" x="100" y="25">字幕独立进程 · CPU</text><text class="sub" x="100" y="46">stable-ts / Whisper Small</text><text class="sub" x="100" y="65">FFmpeg / libass → 字幕 MP4</text>
    </g>
    <g transform="translate(900,310)">
      <rect class="mask" width="240" height="80" rx="6"/><rect class="node secondary" width="240" height="80" rx="6"/>
      <text class="label" x="120" y="24">Qwen Image API · :8093</text><text class="sub" x="120" y="43">基础 40 步 / Viggle Turbo 6 步</text><text class="sub" x="120" y="59">/v1/images/generations</text><text class="sub" x="120" y="73">/v1/images/edits · ComfyUI</text>
    </g>
    <g transform="translate(900,450)">
      <rect class="mask" width="240" height="80" rx="6"/><rect class="node secondary" width="240" height="80" rx="6"/>
      <text class="label" x="120" y="24">MiniMax H3 API · :8092</text><text class="sub" x="120" y="43">Ref2VA INT8 · CUDA / ComfyUI</text><text class="sub" x="120" y="59">/v1/video/assets · /jobs</text><text class="sub" x="120" y="73">512² / 24fps · 生成声画音轨</text>
    </g>
  </g>

  <!-- 6. legend (bottom, outside all regions) -->
  <g id="legend">
    <text class="caption" x="600" y="716">箭头表示调用，结果沿连接返回 Mac · 模型 API 仅监听回环地址 · 成片音轨用于字幕识别 / 对齐</text>
  </g>
</svg>
