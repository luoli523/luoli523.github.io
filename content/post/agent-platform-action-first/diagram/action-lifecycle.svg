  <polygon points="1030,644.0 1125.0,709 1030,774.0 935.0,709" fill="#FFF" stroke="#111111" stroke-width="2.8"/>
  <text x='1030' y='701' font-family='JetBrains Mono, IBM Plex Mono, ui-monospace, monospace' font-size='20' font-weight='700' fill='#111111' text-anchor='middle'>hash</text>
