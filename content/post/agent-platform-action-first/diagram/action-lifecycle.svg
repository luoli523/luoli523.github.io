  <text x='1496' y='104' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='15' font-weight='400' fill='#6B6B6B' text-anchor='start'>虚线 = 重试 / 返回</text>
  <rect x="40" y="300" width="220" height="118" rx="14" fill="#FFFDF8" stroke="#111111" stroke-width="2.8"/>
