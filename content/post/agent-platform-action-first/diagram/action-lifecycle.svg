  <path d="M 1690,316 L 1690,176 L 1030,176 L 1030,298" fill="none" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arr-teal)"/>
