  <text x='925.0' y='687' font-family='JetBrains Mono, IBM Plex Mono, ui-monospace, monospace' font-size='16' font-weight='700' fill='#92400E' text-anchor='middle'>approved</text>
  <path d="M 1030,644 L 1030,420" fill="none" stroke="#0F766E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
  <text x='1046' y='560' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='20' font-weight='700' fill='#0F766E' text-anchor='start'>是</text>
  <path d="M 1080,749 L 1178,803" fill="none" stroke="#DC2626" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-red)"/>
  <text x='1116' y='759' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='20' font-weight='700' fill='#DC2626' text-anchor='start'>否</text>
  <path d="M 820,779 L 820,868" fill="none" stroke="#92400E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-amber)"/>
  <text x='834' y='820' font-family='JetBrains Mono, IBM Plex Mono, ui-monospace, monospace' font-size='16' font-weight='700' fill='#92400E' text-anchor='start'>timeout</text>
  <path d="M 800,764 L 800,848 L 24,848 L 24,164 L 508,164" fill="none" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
  <text x='792' y='805' font-family='JetBrains Mono, IBM Plex Mono, ui-monospace, monospace' font-size='16' font-weight='700' fill='#6B7280' text-anchor='end'>rejected</text>
  <rect x="40" y="990" width="1840" height="62" rx="12" fill="#EFE8DC" stroke="#111111" stroke-width="2"/>
  <text x='960' y='1030' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='26' font-weight='600' fill='#111111' text-anchor='middle'>每次状态变化 → 写入 trace 与 Audit Log（action_id）</text>
