  <rect width="1920" height="1080" fill="#F5F0E8"/>
<text x='960' y='64' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='48' font-weight='700' fill='#111111' text-anchor='middle'>Action 生命周期状态机</text>
  <text x='960' y='106' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='22' font-weight='400' fill='#6B6B6B' text-anchor='middle'>三个分支：deny · allow · require_approval；审批后必须再校验 hash</text>
  <rect x="1480" y="36" width="400" height="86" rx="10" fill="#FFF" stroke="#E7DED2" stroke-width="1.5"/>
