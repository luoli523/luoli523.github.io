  <text x='1690.0' y='394' font-family='Noto Sans CJK SC, Noto Sans SC, sans-serif' font-size='16' font-weight='400' fill='#6B6B6B' text-anchor='middle'>同一个 idempotency key</text>
  <rect x="1500" y="434" width="380" height="86" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2.8"/>
  <text x='1690.0' y='487.0' font-family='JetBrains Mono, IBM Plex Mono, ui-monospace, monospace' font-size='22' font-weight='700' fill='#6B7280' text-anchor='middle'>FAILED</text>
  <rect x="510" y="118" width="320" height="92" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="2.8"/>
